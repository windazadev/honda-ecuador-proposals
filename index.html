<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Ecuador - Propuestas Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .proposals {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        a {
            display: inline-block;
            padding: 15px 30px;
            background-color: #E4002B; /* Honda Red */
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            border-radius: 4px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: 500;
        }
        a:hover {
            background-color: #C00020;
            transform: translateY(-2px);
        }
        p {
            margin-top: 50px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>HONDA ECUADOR</h1>
    <div class="proposals">
        <a href="/propuesta-web/">Ver Propuesta 1 (Original)</a>
        <a href="/propuesta-web-2/">Ver Propuesta 2 (Cinemática)</a>
    </div>
    <p>Seleccione una de las propuestas para visualizarla.</p>
</body>
</html>
