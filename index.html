<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Ecuador - Propuestas Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --honda-red: #E4002B;
            --bg-color: #030303;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            margin: 0;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
            pointer-events: none;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .gallery {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .gallery-item {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: block;
            text-decoration: none;
            color: white;
            cursor: pointer;
            background: #111;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), filter 0.8s ease;
            filter: brightness(0.4) saturate(0.8);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.4) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.8s ease;
        }

        .content-box {
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .gallery-item h2 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 4px 24px rgba(0,0,0,0.8);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .gallery-item span.btn {
            display: inline-block;
            padding: 16px 44px;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(15px);
        }

        /* Hover Motion Effects */
        .gallery-item:hover img {
            transform: scale(1.06);
            filter: brightness(0.9) saturate(1.1);
        }

        .gallery-item:hover .overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 30%, rgba(0,0,0,0.5) 100%);
        }

        .gallery-item:hover .content-box {
            transform: translateY(0);
        }
        
        .gallery-item:hover h2 {
            transform: scale(1.05);
        }

        .gallery-item:hover span.btn {
            opacity: 1;
            transform: translateY(0);
            background: var(--text);
            color: #000;
            border-color: var(--text);
            font-weight: 600;
        }

        @media (max-width: 820px) {
            .gallery {
                flex-direction: column;
            }
            .header {
                padding: 25px;
                background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            }
            .gallery-item img {
                filter: brightness(0.6);
            }
            .gallery-item h2 {
                font-size: 2.2rem;
            }
            .gallery-item span.btn {
                opacity: 1;
                transform: translateY(0);
            }
            .content-box {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Honda Ecuador</h1>
    </div>
    
    <div class="gallery">
        <a href="/propuesta-web/" class="gallery-item">
            <img src="preview-assets/propuesta-1.png" alt="Vista previa Propuesta 1">
            <div class="overlay">
                <div class="content-box">
                    <h2>Propuesta 1</h2>
                    <span class="btn">Visualizar</span>
                </div>
            </div>
        </a>
        
        <a href="/propuesta-web-2/" class="gallery-item">
            <img src="preview-assets/propuesta-2.png" alt="Vista previa Propuesta 2">
            <div class="overlay">
                <div class="content-box">
                    <h2>Propuesta 2</h2>
                    <span class="btn">Visualizar</span>
                </div>
            </div>
        </a>
    </div>
</body>
</html>
