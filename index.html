<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Ecuador - Proyectos</title>
    <!-- Use a condensed/impactful font for the titles -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121213;
            --text: #F0F0F0;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow-x: auto;
            overflow-y: hidden;
            /* Hide scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* Subtle noise texture */
        .noise {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.04;
            pointer-events: none;
            z-index: 10;
        }

        /* Top Header */
        header {
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }
        .logo-text {
            font-family: 'Inter', sans-serif;
            font-style: italic;
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #ccc;
        }

        .menu-label {
            position: fixed;
            top: 40px;
            left: 40px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 5;
        }

        .drag-label {
            position: fixed;
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            font-style: italic;
            font-size: 0.9rem;
            color: #888;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .drag-label span {
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
        }
        
        .arrow-right {
            position: fixed;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: #fff;
            z-index: 5;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .arrow-right:hover {
            opacity: 1;
            background: rgba(255,255,255,0.1);
        }

        /* Background Line */
        .line {
            position: fixed;
            top: 60%;
            left: 0;
            width: 100vw;
            height: 1px;
            background: rgba(255,255,255,0.15);
            z-index: 0;
        }

        /* Horizontal Scroll Container */
        .scroll-container {
            display: flex;
            align-items: center;
            height: 100vh;
            padding-left: 20vw;
            padding-right: 20vw;
            gap: 30vw;
            width: max-content;
        }

        .project {
            position: relative;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            cursor: pointer;
            z-index: 2;
            scroll-snap-align: center;
        }

        .project-image {
            width: 55vw;
            max-width: 800px;
            height: 55vh;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease;
            filter: brightness(0.85) grayscale(20%);
        }

        .project:hover .project-image img {
            transform: scale(1.05);
            filter: brightness(1) grayscale(0%);
        }

        .project h2 {
            position: absolute;
            left: -12vw;
            top: 15%;
            font-family: 'Oswald', sans-serif;
            font-size: 7vw;
            font-weight: 700;
            line-height: 1.05;
            text-transform: uppercase;
            z-index: 2;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 5px 20px rgba(0,0,0,0.5);
            white-space: nowrap;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .project:hover h2 {
            transform: translateX(20px);
        }

        /* Mobile specific adjustments */
        @media (max-width: 820px) {
            html, body {
                scroll-snap-type: y mandatory;
                overflow-x: hidden;
                overflow-y: auto;
            }
            .scroll-container {
                flex-direction: column;
                justify-content: flex-start;
                padding: 120px 20px 60px;
                gap: 60px;
                height: auto;
                width: 100%;
            }
            .project {
                scroll-snap-align: start;
            }
            .project-image {
                width: 90vw;
                height: 45vh;
            }
            .project h2 {
                font-size: 4rem;
                left: 10px;
                top: -40px;
                text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            }
            .drag-label, .line, .menu-label, .arrow-right {
                display: none;
            }
            header {
                background: linear-gradient(to bottom, var(--bg), transparent);
                padding-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    
    <header>
        <div class="logo-text">Honda Ecuador</div>
    </header>

    <div class="menu-label">Menú</div>
    
    <div class="drag-label">
        Explorar
        <span>Desliza para navegar</span>
    </div>

    <!-- Visible arrow button to skip to the next -->
    <button class="arrow-right" onclick="slideNext()">
        &rarr;
    </button>

    <div class="line"></div>

    <div class="scroll-container">
        
        <a href="/propuesta-web/" class="project">
            <h2>PROPUESTA<br>1</h2>
            <div class="project-image">
                <img src="preview-assets/propuesta-1.png" alt="Propuesta 1">
            </div>
        </a>

        <a href="/propuesta-web-2/" class="project">
            <h2>PROPUESTA<br>2</h2>
            <div class="project-image">
                <img src="preview-assets/propuesta-2.png" alt="Propuesta 2">
            </div>
        </a>

    </div>

    <script>
        const slider = document.querySelector('.scroll-container');
        let isDown = false;
        let startX;
        let scrollLeft;

        // Click to drag functionality
        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.style.cursor = 'grabbing';
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = document.documentElement.scrollLeft || document.body.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.cursor = 'pointer';
        });
        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.cursor = 'pointer';
        });
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; 
            window.scrollTo({
                left: scrollLeft - walk,
                behavior: 'auto'
            });
        });

        // Mouse wheel logic: translate vertical scroll to horizontal scroll
        window.addEventListener('wheel', (e) => {
            if(window.innerWidth > 820) {
                // If it's a vertical scroll gesture (e.g. standard mouse wheel)
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    window.scrollBy({
                        left: e.deltaY * 2,
                        behavior: 'auto' // CSS scroll-snap handles the smoothness
                    });
                }
            }
        }, { passive: true });

        // Button functionality to go to next
        function slideNext() {
            window.scrollBy({
                left: window.innerWidth * 0.6,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
